<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>לוח היום · Homie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="tokens/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- supabase-js v2, pinned exact version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script type="module" src="js/supabase.js"></script>
  </head>
  <body class="is-loading">
    <main class="page">
      <h1 class="screen-title">לוח היום</h1>
      <!-- TEMPORARY until Milestone 3 (ADR-4): shows the household members. -->
      <section class="members-strip" aria-labelledby="members-title" hidden>
        <h2 class="section-title" id="members-title">בני הבית</h2>
        <ul class="members-strip__list"></ul>
      </section>
    </main>
    <script type="module">
      import { initProtectedPage } from './js/nav.js';
      import { renderAvatar } from './js/members.js';

      // TEMPORARY until Milestone 3 (ADR-4).
      function renderMembersStrip(members) {
        const section = document.querySelector('.members-strip');
        const list = section.querySelector('.members-strip__list');
        list.replaceChildren();
        for (const member of members) {
          const li = document.createElement('li');
          li.className = 'members-strip__item';
          const name = document.createElement('span');
          name.textContent = member.name;
          li.append(renderAvatar(member, 'm'), name);
          list.append(li);
        }
        section.hidden = false;
      }

      initProtectedPage({ page: 'index', title: 'לוח היום', onReady: renderMembersStrip });
    </script>
  </body>
</html>
