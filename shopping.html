<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>רשימת קניות · Homie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Full screen when saved to the home screen (Milestone 12) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Homie">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Same value as --color-surface in tokens/tokens.css (white top bar) -->
    <meta name="theme-color" content="#FFFFFF">
    <!-- Link preview (WhatsApp etc.): image URL must be absolute -->
    <meta name="description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Homie">
    <meta property="og:title" content="Homie">
    <meta property="og:description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:url" content="https://yardenvsound-web.github.io/Homie/">
    <meta property="og:image" content="https://yardenvsound-web.github.io/Homie/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="he_IL">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="tokens/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- supabase-js v2, pinned exact version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script type="module" src="js/supabase.js"></script>
  </head>
  <body class="is-loading">
    <main class="page shopping">
      <div class="shopping__head">
        <h1 class="screen-title">רשימת קניות</h1>
        <!-- Phone only; on desktop both live in the top bar (ADR-7, ADR-16) -->
        <span class="last-updated shopping__updated" data-last-updated hidden></span>
        <button type="button" class="icon-btn shopping__refresh" data-refresh></button>
      </div>

      <form class="quick-add" novalidate>
        <div class="quick-add__row">
          <div class="field quick-add__name">
            <label class="field__label visually-hidden" for="item-name"></label>
            <input class="field__input" id="item-name" name="item-name" type="text" maxlength="60" autocomplete="off">
          </div>
          <div class="field quick-add__qty">
            <label class="field__label visually-hidden" for="item-qty"></label>
            <input class="field__input" id="item-qty" name="item-qty" type="number" min="1" step="1" inputmode="numeric" value="1">
          </div>
          <button type="submit" class="btn btn--primary quick-add__submit"></button>
        </div>
        <div class="quick-add__errors">
          <p class="field__error" id="item-name-error" hidden></p>
          <p class="field__error" id="item-qty-error" hidden></p>
          <p class="form-error" id="quick-add-error" role="alert"></p>
        </div>
      </form>

      <div class="shopping__alerts"></div>

      <div class="shopping__content" aria-busy="true">
        <div class="skeleton" aria-hidden="true">
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
        </div>
        <ul class="shop-list" aria-label="מוצרים לקנייה" hidden></ul>
        <div class="empty-state empty-state--compact" hidden>
          <span class="empty-state__icon"></span>
          <p class="empty-state__text"></p>
        </div>
      </div>
    </main>
    <!-- "סומן כנקנה" toast with "בטל" (F46) -->
    <div class="toast-region" aria-live="polite"></div>
    <script type="module" src="js/shopping-page.js"></script>
  </body>
</html>
