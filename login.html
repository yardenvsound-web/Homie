<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>כניסה · Homie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Full screen when saved to the home screen (Milestone 12) -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Homie">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- Same value as --color-surface in tokens/tokens.css (white top bar) -->
    <meta name="theme-color" content="#FFFFFF">
    <!-- Link preview (WhatsApp etc.): image URL must be absolute -->
    <meta name="description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Homie">
    <meta property="og:title" content="Homie">
    <meta property="og:description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:url" content="https://yardenvsound-web.github.io/Homie/">
    <meta property="og:image" content="https://yardenvsound-web.github.io/Homie/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="he_IL">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="tokens/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- supabase-js v2, pinned exact version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script type="module" src="js/supabase.js"></script>
  </head>
  <body class="is-loading">
    <main class="page page--center login">
      <h1 class="brand"><img class="brand__logo" src="img/logo.png" alt="Homie" width="403" height="480"></h1>
      <p class="tagline">מה מתכננים להיום?</p>
      <p class="tagline-sub">פחות דיבורים ויותר זמן ביחד</p>

      <section class="card login-card" aria-labelledby="login-title">
        <h2 class="login-card__title" id="login-title">כניסה</h2>
        <p class="login-card__hint">כניסה להורים בלבד</p>

        <form class="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email">אימייל</label>
            <div class="field__control">
              <input class="field__input field__input--ltr" id="email" name="email" type="email"
                     autocomplete="username" inputmode="email" aria-describedby="email-error">
              <svg class="icon field__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.6 4.2-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/>
              </svg>
            </div>
            <p class="field__error" id="email-error" hidden></p>
          </div>

          <div class="field">
            <label class="field__label" for="password">סיסמה</label>
            <div class="field__control">
              <input class="field__input field__input--ltr" id="password" name="password" type="password"
                     autocomplete="current-password" aria-describedby="password-error">
            </div>
            <p class="field__error" id="password-error" hidden></p>
          </div>

          <p class="form-error" id="login-error" role="alert"></p>

          <button class="btn btn--primary btn--block" type="submit">כניסה</button>
        </form>
      </section>
    </main>

    <script type="module">
      import { getSession, signIn } from './js/auth.js';
      import { MESSAGES, icon } from './js/ui.js';

      // Already signed in (e.g. the family tablet): go straight to the board.
      if (await getSession()) {
        window.location.replace('index.html');
      } else {
        document.body.classList.remove('is-loading');
      }

      const form = document.querySelector('.login-form');
      const email = form.querySelector('#email');
      const password = form.querySelector('#password');
      const submit = form.querySelector('button[type="submit"]');
      const formError = form.querySelector('#login-error');

      function setFieldError(input, message) {
        const error = document.getElementById(`${input.id}-error`);
        if (message) {
          input.setAttribute('aria-invalid', 'true');
          error.replaceChildren(icon('warning'), document.createTextNode(message));
          error.hidden = false;
        } else {
          input.removeAttribute('aria-invalid');
          error.replaceChildren();
          error.hidden = true;
        }
      }

      for (const input of [email, password]) {
        input.addEventListener('input', () => setFieldError(input, null));
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formError.textContent = '';

        const emailValue = email.value.trim();
        const passwordValue = password.value;
        setFieldError(email, emailValue ? null : MESSAGES.emailRequired);
        setFieldError(password, passwordValue ? null : MESSAGES.passwordRequired);
        const firstInvalid = form.querySelector('[aria-invalid="true"]');
        if (firstInvalid) {
          firstInvalid.focus();
          return;
        }

        submit.disabled = true;
        submit.textContent = MESSAGES.signingIn;

        const result = await signIn(emailValue, passwordValue);
        if (result.ok) {
          window.location.replace('index.html');
          return;
        }

        submit.disabled = false;
        submit.textContent = MESSAGES.signIn;
        if (result.reason === 'credentials') {
          formError.textContent = MESSAGES.loginBadCredentials;
          password.value = '';
          password.focus();
        } else {
          formError.textContent = MESSAGES.loginNetwork;
        }
      });
    </script>
  </body>
</html>
