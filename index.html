<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>לוח היום · Homie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Link preview (WhatsApp etc.): image URL must be absolute -->
    <meta name="description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Homie">
    <meta property="og:title" content="Homie">
    <meta property="og:description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:url" content="https://yardenvsound-web.github.io/Homie/">
    <meta property="og:image" content="https://yardenvsound-web.github.io/Homie/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="he_IL">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="tokens/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- supabase-js v2, pinned exact version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script type="module" src="js/supabase.js"></script>
  </head>
  <body class="is-loading">
    <main class="page board">
      <div class="board__head">
        <h1 class="visually-hidden">לוח היום</h1>
        <!-- View menu (F51): daily / weekly / monthly -->
        <div class="view-switch">
          <button type="button" class="view-toggle" aria-haspopup="menu" aria-expanded="false" aria-controls="view-menu"></button>
          <ul class="view-menu" id="view-menu" role="menu" hidden>
            <li role="none"><button type="button" class="add__item view-menu__item" role="menuitemradio" data-view="day" aria-checked="true"></button></li>
            <li role="none"><button type="button" class="add__item view-menu__item" role="menuitemradio" data-view="week" aria-checked="false"></button></li>
            <li role="none"><button type="button" class="add__item view-menu__item" role="menuitemradio" data-view="month" aria-checked="false"></button></li>
          </ul>
        </div>
        <div class="add">
          <button type="button" class="btn btn--primary add__toggle add__toggle--wide" aria-expanded="false" aria-controls="add-menu"></button>
          <button type="button" class="fab add__toggle add__toggle--phone" aria-expanded="false" aria-controls="add-menu"></button>
          <ul class="add__menu" id="add-menu" hidden>
            <li><button type="button" class="add__item" data-add="task"></button></li>
            <li><button type="button" class="add__item" data-add="event"></button></li>
          </ul>
        </div>
      </div>

      <div class="daybar">
        <button type="button" class="icon-btn" data-day="prev"></button>
        <p class="daybar__date" aria-live="polite"></p>
        <button type="button" class="icon-btn" data-day="next"></button>
        <button type="button" class="btn btn--secondary btn--small daybar__today" hidden></button>
        <!-- Phone only; on desktop both live in the top bar (ADR-7, ADR-16) -->
        <div class="daybar__sync">
          <span class="last-updated daybar__updated" data-last-updated hidden></span>
          <button type="button" class="icon-btn daybar__refresh" data-refresh></button>
        </div>
      </div>

      <div class="board__alerts"></div>

      <div class="board__content" aria-busy="true">
        <div class="skeleton" aria-hidden="true">
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
        </div>

        <div class="board__view" hidden></div>

        <div class="empty-state" hidden>
          <span class="empty-state__icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
          </span>
          <p class="empty-state__text"></p>
          <button type="button" class="btn btn--primary empty-state__add"></button>
        </div>
      </div>
    </main>
    <script type="module" src="js/board.js"></script>
  </body>
</html>
