<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ממתין לאישור · Homie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <!-- Link preview (WhatsApp etc.): image URL must be absolute -->
    <meta name="description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Homie">
    <meta property="og:title" content="Homie">
    <meta property="og:description" content="מה מתכננים להיום? פחות דיבורים ויותר זמן ביחד">
    <meta property="og:url" content="https://yardenvsound-web.github.io/Homie/">
    <meta property="og:image" content="https://yardenvsound-web.github.io/Homie/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="he_IL">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@600;700&family=Noto+Sans+Hebrew:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="tokens/tokens.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- supabase-js v2, pinned exact version -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script type="module" src="js/supabase.js"></script>
  </head>
  <body class="is-loading">
    <main class="page pending">
      <div class="pending__head">
        <h1 class="screen-title">ממתין לאישור <span class="count-badge count-badge--title" data-pending-count aria-hidden="true" hidden></span></h1>
        <!-- Phone only; on desktop both live in the top bar (ADR-7, ADR-16) -->
        <span class="last-updated pending__updated" data-last-updated hidden></span>
        <button type="button" class="icon-btn pending__refresh" data-refresh></button>
      </div>
      <p class="screen-subtitle">פריטים שממתינים לפעולת הורה</p>

      <div class="pending__alerts"></div>
      <p class="visually-hidden" role="status" aria-live="polite" id="pending-status"></p>

      <div class="pending__content" aria-busy="true">
        <div class="skeleton" aria-hidden="true">
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
          <div class="skeleton__row"></div>
        </div>

        <section class="pending-section" id="pending-google" aria-labelledby="pending-google-title" hidden>
          <h2 class="section-title" id="pending-google-title" tabindex="-1"></h2>
          <ul class="pending-list"></ul>
        </section>

        <section class="pending-section" id="pending-ai" aria-labelledby="pending-ai-title" hidden>
          <h2 class="section-title" id="pending-ai-title" tabindex="-1"></h2>
          <ul class="pending-list"></ul>
        </section>

        <div class="empty-state empty-state--compact" hidden>
          <span class="empty-state__icon"></span>
          <p class="empty-state__text"></p>
        </div>
      </div>
    </main>
    <script type="module" src="js/pending.js"></script>
  </body>
</html>
